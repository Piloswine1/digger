[tools]
go = "latest"
node = "latest"

[tasks.'podman:socket']
run = 'podman system service -t 0'

[tasks.dev]
sources = ["cmd/main.go", "inner/**/*.go"]
run = "go run cmd/main.go"

[tasks.'build:front']
dir = "front"
run = "pnpm build"

[tasks.'prepare:dist']
depends = ["build:front"]
description = "prepares front to backend"
run = "sh ./script/prepare-dist.sh"

[tasks.'build:docker']
run = [
	'podman build -t ghcr.io/piloswine1/digger:latest .',
	'podman push ghcr.io/piloswine1/digger:latest',
]

[tasks.'run:docker']
depends = ["build:docker"]
run = "script/run.sh"

[env]
DOCKER_HOST = 'unix:///run/user/1000/podman/podman.sock'
GIN_MODE = 'debug'
